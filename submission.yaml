short-description: #This is a super cool project!
This project develops a compact edge AI accelerator for end-to-end spiking neural network 
inference and on-chip learning, supporting operators such as depthwise convolution, 
pointwise convolution, and fully connected layers. It also explores SDSP-based lifelong 
learning and always-on applications such as seizure and fall detection.
# Please add the documentation about your project here.
