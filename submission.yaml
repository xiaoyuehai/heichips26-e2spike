long-description: |
This project is awarded as this year's HeiChips Best project (digital), E2Spike can support
end-to-end execution based on Spiking Neural Networks, currently can run 12-layer lightweight
model for some edge computing, combining with SDSP-based on-chip learning. Here are some conclusion,
 * End-to-End SNN models inference;
 * Support 5 operators, including DW/PW convolution, Max/Average pooling, and fully connected;
 * Verified on EEG-based seizure detection and DVS-based fall detection.
  
Here is the open-source repostiroy [links](https://github.com/xiaoyuehai/heichips26-e2spike).

